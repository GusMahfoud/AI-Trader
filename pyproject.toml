[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Double DQN reinforcement learning agent for stock trading."
license = { file = "LICENSE" }
authors = [{ name = "Gus Mahfoud" }]
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "gymnasium",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "PyYAML",
    "yfinance",
    "streamlit",
    "plotly",
    "lightgbm",
    "scikit-learn", # required by lightgbm.sklearn (LGBMRanker)
    "pydantic",
    "fastapi",
    "uvicorn",
    "httpx", # starlette TestClient backend
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-trader = "ai_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
