[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trader"
version = "0.1.0"
description = "Double DQN reinforcement learning agent for stock trading."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "gymnasium",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "PyYAML",
    "yfinance",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ai-trader = "ai_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
