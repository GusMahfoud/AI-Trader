device: "cuda" # "auto", "cuda", "cpu" — set to "cuda" to fail loudly if GPU is missing

env:
  # Data source: "csv", "yfinance", or "synthetic"
  data_source: "yfinance"
  data_path: "data/AAPL.csv" # required when data_source="csv"
  ticker: "AAPL"
  start_date: "2015-01-01"
  end_date: null
  synthetic_length: 3000

  # Chronological splits
  train_ratio: 0.70
  val_ratio: 0.15

  # Trading dynamics
  initial_cash: 10000
  transaction_cost: 0.0003
  slippage: 0.0001
  max_position: 10
  allow_short: false
  trade_size: 1

  # State + reward shaping
  lookback_window: 20
  random_start: true
  reward_scale: 100.0
  risk_penalty: 0.001
  position_penalty: 0.0002
  inactivity_penalty: 0.005

agent:
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 100000
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995
  tau: 0.001

training:
  seed: 42
  episodes: 5000
  max_steps_per_episode: 252
  eval_every: 20
  eval_episodes: 5

output_dir: "results/double_dqn"
