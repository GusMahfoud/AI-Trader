# Defaults below = the current champion (plain MLP + PER + N-step=2, doubled drawdown
# penalty, capital-fraction sizing). experiments/champion.yaml mirrors this as the
# self-contained source of truth; every other experiment file is a one-variable delta.
device: "auto" # "auto", "cuda", "cpu" — "auto" falls back to CPU/MPS when no GPU

env:
  # Data source: "csv", "yfinance", or "synthetic"
  data_source: "yfinance"
  data_path: "data/AAPL.csv" # required when data_source="csv"
  ticker: "AAPL"
  # 2010 start matches the validated cross-sectional protocol (all rank_* runs).
  start_date: "2010-01-01"
  end_date: null
  synthetic_length: 3000

  # Chronological splits
  train_ratio: 0.70
  val_ratio: 0.15

  # Optional regime features for ablation: any of
  # [volume_regime, vol_regime, price_position]. Empty = base 11 features only.
  extra_features: []

  # Cross-sectional universe (rank_backtest / picks modes). Fixed list of liquid
  # US large caps that existed at the 2010 backtest start — yfinance has no
  # point-in-time membership, so results carry a documented survivorship bias
  # (names that later failed are absent). Promoted 2026-07-10 from the frozen 50
  # to the WIDE 112-name list: breadth doubled IC to 0.043 (run 5c6ad10c) and
  # backs the working strategy (b07ac9f3 / 6dea9161). K (Kellogg) removed —
  # renamed ticker, download fails. Empty list = single-ticker modes unaffected.
  universe:
    [
      AAPL,
      MSFT,
      GOOGL,
      AMZN,
      JPM,
      BAC,
      WFC,
      GS,
      MS,
      C,
      USB,
      JNJ,
      PFE,
      MRK,
      ABT,
      BMY,
      LLY,
      AMGN,
      UNH,
      XOM,
      CVX,
      COP,
      SLB,
      PG,
      KO,
      PEP,
      WMT,
      COST,
      HD,
      MCD,
      NKE,
      MO,
      CL,
      T,
      VZ,
      CSCO,
      INTC,
      ORCL,
      IBM,
      TXN,
      QCOM,
      ADP,
      GE,
      CAT,
      MMM,
      BA,
      HON,
      UPS,
      DIS,
      AXP,
      ADBE,
      AMD,
      NVDA,
      MU,
      HPQ,
      AMAT,
      ADI,
      INTU,
      EBAY,
      EA,
      BLK,
      SCHW,
      BK,
      PNC,
      COF,
      MET,
      PRU,
      AIG,
      ALL,
      TRV,
      TMO,
      DHR,
      MDT,
      SYK,
      BSX,
      GILD,
      CI,
      CVS,
      HUM,
      BDX,
      OXY,
      EOG,
      HAL,
      DVN,
      FCX,
      NEM,
      NUE,
      APD,
      GIS,
      SYY,
      KR,
      TJX,
      ROST,
      YUM,
      SBUX,
      TGT,
      LOW,
      SO,
      DUK,
      D,
      EXC,
      AEP,
      NEE,
      ED,
      LMT,
      NOC,
      GD,
      DE,
      EMR,
      CSX,
      UNP,
      FDX,
    ]

  # Trading dynamics
  initial_cash: 10000
  transaction_cost: 0.0003
  slippage: 0.0001
  # Position sizing. "shares": fixed trade_size/max_position (legacy, price-dependent).
  # "fraction": size each trade as a fraction of current equity (capital-aware,
  # price-agnostic, multi-asset-ready) — see experiments/champion.yaml.
  position_sizing: "fraction" # "shares" | "fraction" — champion uses fraction
  max_position: 10 # shares-mode cap (max shares held)
  trade_size: 1 # shares-mode units per trade
  trade_fraction: 0.25 # fraction-mode: fraction of equity per trade
  max_exposure: 1.0 # fraction-mode: max gross exposure as a fraction of equity
  allow_short: false
  stop_loss: null # e.g. 0.05 = exit if portfolio drops 5% from peak (null = off)
  take_profit: null # e.g. 0.10 = exit if portfolio is up 10% from start  (null = off)

  # State + reward shaping
  lookback_window: 20
  random_start: true
  reward_scale: 100.0
  risk_penalty: 0.002
  position_penalty: 0.0002
  inactivity_penalty: 0.005
  underexposure_penalty: 0.005 # idle-capital cost; 0.005 = sweep peak (capture 59%->73%, Sharpe 0.918, 5/8 folds beat B&H); 0.0075/0.01 regress

agent:
  gamma: 0.99
  learning_rate: 0.0005
  batch_size: 64
  buffer_size: 100000
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995
  tau: 0.001
  network: "mlp" # "mlp" | "dueling" — MLP beat dueling on walk-forward (1.26 vs 0.82 Sharpe, 3/4 folds)
  replay: "per" # "uniform" | "per"
  n_steps: 2 # N-step returns (1 = standard TD)
  per_alpha: 0.6 # PER priority exponent
  per_beta_start: 0.4 # IS weight start (anneals to 1.0)
  per_beta_frames: 100000

# Cross-sectional ranking (--mode rank_backtest / picks). Defaults = the
# WORKING STRATEGY promoted 2026-07-10: LambdaRank v1 on the wide universe,
# top 10 equal-weight, turnover buffer 20 (run 6dea9161: Sharpe 1.478, beats
# equal-weight +0.008 and SPY +0.21). Costs from env.transaction_cost + slippage.
rank:
  top_k: 10
  rebalance_days: 21 # trading days between rebalances (~1 month)
  label_horizon: 21 # forward-return window for labels/IC (also the purge gap)
  test_ratio: 0.4 # trailing share of dates tiled by the test folds
  score_feature: "mom_12_1" # heuristic fallback score (model: "momentum" only)
  benchmark_ticker: "SPY"
  model: "lambdarank" # "momentum" (heuristic score) | "lambdarank" (LightGBM ranker per fold)
  label_bins: 4 # per-date fwd-return quantile grades for the ranker
  feature_set: "v1" # "v1" (7 base signals) | "v2" (+ vol-adj mom, 52w-high, up-ratio, sector ranks) — v2 rejected (0419ac6b)
  # Phase-5 portfolio rules. buffer_k 20 promoted 2026-07-07: run 6dea9161
  # (wide top-10 + buffer) Sharpe 1.478 — first strategy to beat equal-weight
  # (+0.008) AND SPY (+0.21). inverse_vol (2cebb413: 1.345) and dd_brake
  # (ab898649: 1.161) both regressed and stay off.
  buffer_k: 20 # keep incumbents while ranked <= buffer_k (0 = off)
  weighting: "equal" # "equal" | "inverse_vol" (capital proportional to 1/vol_60)
  dd_brake: 0.0 # halve exposure while drawdown from peak exceeds this fraction
  sector_cap: 0 # max holdings per sector (0 = off; under validation, see rank_p5_seccap)

training:
  seed: 42
  episodes: 2500
  max_steps_per_episode: 252
  eval_every: 20
  eval_episodes: 10
  early_stop_patience: 25 # stop if val Sharpe hasn't improved in N eval intervals (0 = off)
  early_stop_warmup: 300 # don't start patience counter until after this many episodes
  n_splits: 4 # number of rolling folds for --mode walk_forward


# output_dir is no longer used — results go to results/<run_id>/ (auto-generated at runtime)
