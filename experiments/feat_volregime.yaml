# Feature ablation — add vol_regime (5-day vol / 20-day vol) to the dueling champion.
# One feature added from dueling_per_n2.
# Run with:
#   python -m ai_trader --mode train --run-id feat_volregime_v3 --override experiments/feat_volregime.yaml
agent:
  network: "dueling"
  replay: "per"
  n_steps: 2
env:
  extra_features: ["vol_regime"]
