# Cross-sectional pivot Phase 4e — combine the two validated deltas:
# WIDE universe (113 names; run 5c6ad10c doubled ic_mean to 0.0426, ic_ir 0.29 —
# first signal past the 0.03 decision-grade gate) + top_k 10 (run b6ff7c5e:
# Sharpe 1.405 vs top-5's 1.32 by diluting concentration).
# Hypothesis: 10-of-113 converts the decision-grade signal into portfolio Sharpe
# that the over-concentrated 5-of-113 (Sharpe 1.19, DD -20%) wasted.
# Decision gate (pre-committed): adopt as the working strategy if Sharpe > 1.405
# AND >= 4/6 folds beat SPY; promotion-gate comparison vs equal-weight (1.47 on
# this universe) evaluated separately in Phase 5.
