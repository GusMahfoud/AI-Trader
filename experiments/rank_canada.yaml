# Canadian-market option — the working strategy (LambdaRank v1, top 10,
# buffer 20) on a TSX large-cap universe, benchmarked against XIU.TO
# (S&P/TSX 60 ETF, CAD). All prices CAD so no FX mixing. Same survivorship
# caveat as the US universe (names chosen as of ~2010 that survived; class-B
# tickers that fail to download are dropped with a warning).
# VALIDATION GATE (pre-committed): the TSX has ~half the breadth of the wide
# US universe and heavy financials/energy concentration, so demand the same
# standard — ic_mean >= 0.03 AND Sharpe beats BOTH equal-weight and XIU.TO —
# before Canadian picks are used for paper trading.
#
# VERDICT (run efdd91be, 2026-07-12): GATE FAILED — ic_mean 0.006 (vs 0.043
# US), 0/6 folds beat equal-weight (EW Sharpe 1.856 vs strategy 1.460). The
# ranking signal adds nothing on this universe; its absolute Sharpe is just
# market beta. Breadth (54 names) is half the US universe's and the momentum
# signal doesn't discriminate within the financials/materials-heavy TSX.
# Canadian picks must NOT be paper-traded. Config kept for future revisits
# (e.g. combined US+CA universe with FX handling, or TSX-specific features).
