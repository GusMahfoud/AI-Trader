# Reward Tune B (dueling base) — double the inactivity penalty.
# Re-baselined on the dueling champion. The champion is very selective (~24 trades); a stronger
# hold penalty tests whether more activity helps or hurts risk-adjusted return.
# One variable changed from dueling_per_n2.
# Run with:
#   python -m ai_trader --mode train --run-id reward_tune_b_v3 --override experiments/reward_tune_b.yaml
agent:
  network: "dueling"
  replay: "per"
  n_steps: 2
env:
  inactivity_penalty: 0.01
