# Feature ablation — add price_position (close within 52-week range) to the dueling champion.
# One feature added from dueling_per_n2.
# Run with:
#   python -m ai_trader --mode train --run-id feat_priceposition_v3 --override experiments/feat_priceposition.yaml
agent:
  network: "dueling"
  replay: "per"
  n_steps: 2
env:
  extra_features: ["price_position"]
