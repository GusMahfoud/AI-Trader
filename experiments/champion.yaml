# ── CURRENT CHAMPION — single source of truth for "our best model" ──────────────
# Architecture: plain MLP + PER + N-step=2, doubled drawdown penalty (risk 0.002),
# capital-fraction sizing.
# Lineage: previous champion (dueling + PER + n2, "reward_tune_c") with the dueling
# head removed — this was the "champion_mlp" Tier-0 ablation in the model battery.
#
# Why this is the champion (walk-forward, 4 rolling folds — the honest test):
#   champion_mlp   mean Sharpe 1.26 ± 0.62 | return 19.5% | drawdown -13.3%
#   old champion   mean Sharpe 0.82 ± 0.64 | return 13.6% | drawdown -15.5%
#   buy_and_hold   mean Sharpe 1.12 ± 0.62 | return 25.2% | drawdown -18.3%
# The MLP beat the dueling champion in 3 of 4 folds with better drawdown — the
# dueling head was not earning its complexity. HONEST CAVEAT: the +0.14 Sharpe edge
# over buy-and-hold is within noise (SE ≈ 0.31 over 4 folds). This is a
# simplification promotion, not an alpha claim.
# Battery keeps: PER (uniform replay collapsed to 0.43), fraction sizing (shares
# left ~80% of capital idle), risk_penalty 0.002 (reward tier was all noise).
#
# NOTE: a clean fixed-split checkpoint for this config has not been trained yet.
# Train one with:
#   python -m ai_trader --mode train --run-id champion --override experiments/champion.yaml
# then re-run walk-forward for fresh, honest numbers:
#   python -m ai_trader --mode walk_forward --run-id wf_champion --override experiments/champion.yaml
#
# This file is self-contained (does not rely on config.yaml defaults) so its meaning
# never drifts when the base config changes.
agent:
  network: "mlp"
  replay: "per"
  n_steps: 2
env:
  risk_penalty: 0.002
  position_sizing: "fraction"
  trade_fraction: 0.25
  max_exposure: 1.0
  underexposure_penalty: 0.0 # champion predates the idle-capital penalty; pinned off
