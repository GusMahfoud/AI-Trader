# Env battery — de-shaping ladder, rung 1: MINIMAL reward (return + drawdown
# penalty only). Drops the three exposure-shaping terms, keeps the one term that
# encodes the actual objective (risk-adjusted return). Compare against env_raw_ext
# (rung 0) and env_lean_ext (rung 2) to locate where shaping starts paying.
# Extended protocol, one hypothesis delta.
env:
  start_date: "2005-01-01"
  position_penalty: 0.0
  inactivity_penalty: 0.0
  underexposure_penalty: 0.0
training:
  n_splits: 8
